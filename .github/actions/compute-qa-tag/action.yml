name: Compute QA tag
description: >
  Computes the next vX.Y.0-qa.N tag for the given release branch, creates it, and pushes it.
  X.Y comes from the branch name; N auto-increments from the highest existing qa tag for that X.Y.

inputs:
  release_branch:
    description: 'Release branch this QA build targets, e.g. "release/v2.3"'
    required: true

outputs:
  tag_name:
    description: "The tag that was created, e.g. v2.3.0-qa.4"
    value: ${{ steps.tag.outputs.tag_name }}

runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      run: |
        BRANCH="${{ inputs.release_branch }}"
        MAJOR_MINOR="${BRANCH#release/v}"

        LAST_N=$(git tag --list "v${MAJOR_MINOR}.0-qa.*" | sed -E "s/.*-qa\.([0-9]+)$/\1/" | sort -n | tail -1)
        NEXT_N=$(( ${LAST_N:-0} + 1 ))
        TAG_NAME="v${MAJOR_MINOR}.0-qa.${NEXT_N}"

        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag -a "$TAG_NAME" -m "Deployed to QA"
        git push origin "$TAG_NAME"

        echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
