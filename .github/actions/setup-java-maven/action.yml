name: Set up Java and Maven
description: >
    Installs a Temurin JDK with Maven dependency caching. Optionally writes a Maven settings.xml that adds an
    authenticated repository to resolve dependencies from (e.g. GitHub Packages), with the given credentials.

inputs:
    java_version:
        description: "JDK version to install"
        required: false
        default: "21"
    maven_repository_url:
        description: >
            Extra Maven repository to resolve dependencies from, e.g. "https://maven.pkg.github.com/<owner>/<repo>".
            Leave empty to keep the settings.xml that actions/setup-java writes.
        required: false
        default: ""
    maven_repository_id:
        description: "Id of that repository; must match the id the project's pom.xml uses for it"
        required: false
        default: github
    maven_repository_username:
        description: "Username for that repository"
        required: false
        default: ""
    maven_repository_password:
        description: "Password or token for that repository. Pass it from a secret"
        required: false
        default: ""

runs:
    using: composite
    steps:
        - uses: actions/setup-java@v4
          with:
              distribution: temurin
              java-version: ${{ inputs.java_version }}
              cache: maven

        - name: Configure the extra Maven repository
          if: inputs.maven_repository_url != ''
          shell: bash
          env:
              REPO_URL: ${{ inputs.maven_repository_url }}
              REPO_ID: ${{ inputs.maven_repository_id }}
              REPO_USERNAME: ${{ inputs.maven_repository_username }}
              REPO_PASSWORD: ${{ inputs.maven_repository_password }}
          run: |
              if [[ -z "$REPO_PASSWORD" ]]; then
                  echo "::warning::maven_repository_password is empty; resolving from $REPO_URL will likely fail. Is the secret available to this workflow?"
              fi

              mkdir -p ~/.m2
              cat > ~/.m2/settings.xml <<XML
              <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                            http://maven.apache.org/xsd/settings-1.0.0.xsd">
                <activeProfiles>
                  <activeProfile>${REPO_ID}</activeProfile>
                </activeProfiles>

                <profiles>
                  <profile>
                    <id>${REPO_ID}</id>
                    <repositories>
                      <repository>
                        <id>central</id>
                        <url>https://repo.maven.apache.org/maven2</url>
                      </repository>
                      <repository>
                        <id>${REPO_ID}</id>
                        <url>${REPO_URL}</url>
                        <snapshots><enabled>true</enabled></snapshots>
                      </repository>
                    </repositories>
                  </profile>
                </profiles>

                <servers>
                  <server>
                    <id>${REPO_ID}</id>
                    <username>${REPO_USERNAME}</username>
                    <password>${REPO_PASSWORD}</password>
                  </server>
                </servers>
              </settings>
              XML
